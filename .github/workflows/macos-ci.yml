name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and build Universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify password app bundle identifiers on macOS
        run: |
          passwords_id="$(osascript -e 'id of app "Passwords"')"
          keychain_id="$(osascript -e 'id of app "Keychain Access"')"
          printf 'Passwords=%s\n' "$passwords_id"
          printf 'Keychain Access=%s\n' "$keychain_id"
          test "$passwords_id" = "com.apple.Passwords"
          test "$keychain_id" = "com.apple.keychainaccess"

      - name: Run Swift core tests
        run: bash Scripts/test.sh

      - name: Build and verify app bundle
        run: bash Scripts/build.sh

      - name: Upload finished app
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Shelf-1.0.0
          path: |
            dist/Clipboard-Shelf-1.0.0.zip
            dist/Clipboard-Shelf-1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
