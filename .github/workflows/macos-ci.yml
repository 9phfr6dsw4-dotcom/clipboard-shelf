name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test and build Universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify password app bundle identifiers on macOS
        run: |
          passwords_id="$(osascript -e 'id of app "Passwords"')"
          keychain_id="$(osascript -e 'id of app "Keychain Access"')"
          printf 'Passwords=%s\n' "$passwords_id"
          printf 'Keychain Access=%s\n' "$keychain_id"
          test "$passwords_id" = "com.apple.Passwords"
          test "$keychain_id" = "com.apple.keychainaccess"

      - name: Verify isolated synthetic clipboard fixture
        timeout-minutes: 10
        run: bash .github/scripts/verify-clipboard-demo-isolation.sh

      - name: Verify PID-bound popover geometry with a synthetic fixture
        timeout-minutes: 10
        run: bash .github/scripts/verify-status-popover-geometry.sh

      - name: Run Swift core tests
        run: bash Scripts/test.sh

      - name: Build and verify app bundle
        run: bash Scripts/build.sh

      - name: Upload finished app
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Shelf-1.0.2
          path: |
            dist/Clipboard-Shelf-1.0.2.zip
            dist/Clipboard-Shelf-1.0.2.zip.sha256
          if-no-files-found: error
          retention-days: 30

  readme-media-safety:
    name: README media safety tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test README media safety and format checks
        run: |
          bash .github/scripts/test-readme-media-runtime.sh
          python3 .github/scripts/test-readme-media-artifacts.py
          python3 .github/scripts/test-readme-media-security.py
          python3 .github/scripts/test-readme-media-demo.py
          python3 .github/scripts/test-readme-media-capture-validation.py
          python3 .github/scripts/test-readme-media-release.py
          python3 .github/scripts/test-readme-media-popover-selection.py
