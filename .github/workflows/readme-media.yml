name: README media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && github.repository == '9phfr6dsw4-dotcom/clipboard-shelf' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test README media safety and format checks
        run: |
          bash .github/scripts/test-readme-media-runtime.sh
          python3 .github/scripts/test-readme-media-artifacts.py
          python3 .github/scripts/test-readme-media-security.py
          python3 .github/scripts/test-readme-media-demo.py
          python3 .github/scripts/test-readme-media-capture-validation.py
          python3 .github/scripts/test-readme-media-release.py
          python3 .github/scripts/test-readme-media-popover-selection.py
      - name: Capture the published release app and prepare README media
        env:
          APP_KEY: clipboard-shelf
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/capture-readme-media.sh
      - name: Upload sanitized geometry diagnostics on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: clipboard-shelf-geometry-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/readme-media/diagnostics/geometry-snapshot.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: clipboard-shelf-readme-media-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readme-media/clipboard-shelf-light.png
            ${{ runner.temp }}/readme-media/clipboard-shelf-dark.png
            ${{ runner.temp }}/readme-media/clipboard-shelf-hero.gif
            ${{ runner.temp }}/readme-media/clipboard-shelf-hero.mp4
          if-no-files-found: error
          retention-days: 14
