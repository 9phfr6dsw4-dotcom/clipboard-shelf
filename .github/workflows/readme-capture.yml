name: Temporary README image capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app and export its icon
        run: |
          set -euo pipefail
          bash Scripts/build.sh
          mkdir -p "$RUNNER_TEMP/readme-images"
          sips -s format png "dist/Clipboard Shelf.app/Contents/Resources/AppIcon.icns" --out "$RUNNER_TEMP/readme-images/clipboard-shelf-icon.png" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-shelf-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7
