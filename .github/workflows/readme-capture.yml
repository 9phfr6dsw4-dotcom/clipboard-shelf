name: Temporary README screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash Scripts/build.sh
      - name: Seed synthetic clipboard text and capture the menu-bar app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readme-images"
          cat > "$RUNNER_TEMP/capture.swift" <<'SWIFT'
          import AppKit
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers
          import Foundation
          let args = CommandLine.arguments
          guard args.count == 3 else { fatalError("owner and output required") }
          let owner = args[1]
          let output = URL(fileURLWithPath: args[2])
          let windows = (CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]]) ?? []
          guard let row = windows.first(where: { ($0[kCGWindowOwnerName] as? String) == owner && ($0[kCGWindowLayer] as? Int ?? 0) == 0 }),
                let number = row[kCGWindowNumber] as? CGWindowID,
                let image = CGWindowListCreateImage(.null, .optionIncludingWindow, number, [.boundsIgnoreFraming, .bestResolution]),
                let destination = CGImageDestinationCreateWithURL(output as CFURL, UTType.png.identifier as CFString, 1, nil) else {
            fputs("Could not capture a visible window for \(owner)\n", stderr); exit(1)
          }
          CGImageDestinationAddImage(destination, image, nil)
          guard CGImageDestinationFinalize(destination) else { exit(2) }
          SWIFT
          APP="dist/Clipboard Shelf.app"
          open "$APP"
          printf 'Project notes: finish the welcome page draft' | pbcopy
          sleep 1
          printf 'Release checklist: review the download and privacy copy' | pbcopy
          sleep 1
          printf 'Design review: confirm spacing and contrast' | pbcopy
          sleep 1
          printf 'Build status: macOS package verified' | pbcopy
          sleep 2
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "Clipboard Shelf"
              set frontmost to true
              delay 1
              click menu bar item 1 of menu bar 1
              delay 2
            end tell
          end tell
          APPLESCRIPT
          sips -s format png "$APP/Contents/Resources/AppIcon.icns" --out "$RUNNER_TEMP/readme-images/clipboard-shelf-icon.png" >/dev/null
          swift "$RUNNER_TEMP/capture.swift" ClipboardShelf "$RUNNER_TEMP/readme-images/clipboard-shelf-window.png"
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-shelf-readme-images
          path: ${{ runner.temp }}/readme-images/*.png
          if-no-files-found: error
          retention-days: 7
